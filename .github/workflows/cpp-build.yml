name: Build Workflow

on:
  push:
    branches: '**'
    paths:
      - '**.hpp'
      - '**.h'
      - '**.cpp'
      - '**.asm'
      - '**.reds'
      - '**.xl'
      - '**.in'
      - 'xmake.lua'
      - 'config/**'
      - 'scripts/**'
      - 'bundle/source/resources/**'
      - 'tools/dist/**'
      - 'vendor/**'
      - '.github/workflows/cpp-build.yml'
  pull_request:
    paths:
      - '**.hpp'
      - '**.h'
      - '**.cpp'
      - '**.asm'
      - '**.reds'
      - '**.xl'
      - '**.in'
      - 'xmake.lua'
      - 'config/**'
      - 'scripts/**'
      - 'bundle/source/resources/**'
      - 'tools/dist/**'
      - 'vendor/**'
      - '.github/workflows/cpp-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.mode }})
    runs-on: windows-latest

    strategy:
      matrix:
        mode: [debug, release]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set commit SHA environment variable
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          Add-Content -LiteralPath ${env:GITHUB_ENV} -Encoding UTF8 -Value "ARCHIVEXL_BUILD_COMMIT_SHA=${sha}"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          package-cache: true
          package-cache-key: windows-x64-${{ matrix.mode }}
          project-path: ${{ github.workspace }}

      - name: Configure
        shell: pwsh
        run: xmake f -y -p windows -a x64 -m ${{ matrix.mode }} --vs=2022

      - name: Build
        shell: pwsh
        run: xmake -y

      - name: Package
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Recurse -Filter ArchiveXL.dll |
            Where-Object { $_.FullName -match "[\\/]${{ matrix.mode }}[\\/]" } |
            Select-Object -First 1
          if (-not $dll) {
            throw "ArchiveXL.dll was not produced for ${{ matrix.mode }}."
          }
          & "${{ github.workspace }}/tools/dist/package-mod.ps1" -ReleaseBin $dll.FullName

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ArchiveXL-${{ matrix.mode }}-${{ env.ARCHIVEXL_BUILD_COMMIT_SHA }}
          path: build/dist/*.zip
          if-no-files-found: error
